<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Mon blog</h1>
        <nav>
            <ul>
                <il><a href="#">Acceuil</a></il>
                <il><a href="#">Contact</a></il>
            </ul>
        </nav>
    </header>
    <section>
        <h2>Section 1 (texte)</h2>
        <div>
            <p>Texte du section 1</p>
        </div>
    </section>
    <section>
        <h2>Section 2 (image)</h2>
        <img src="image.jpg" alt="Description de l'image">
    </section>
    <section>
        <h2>Section 3 (vidéo)</h2>
        <video controls>
            <source src="video.mp4" type="video/mp4">
        </video>
    </section>
    <section>
        <h2>Section 4 (Link)</h2>
        <a href="https://example.com">Lien vers Example</a>
        <span style="color:red;">Lien en rouge</span>
        <strong>Texte en gras</strong>
    </section>
    <section>
        <h2>Section 5 (Tableau)</h2>
        <table border ="1">
            <tr>
                <th>Nom</th>
                <th>Age</th>
            </tr>
            <tr>
                <th>Alice</th>
                <th>25</th>
            </tr>
        </table>
    </section>
    <section>
        <h2>Section 6 (Form)</h2>
        <form>
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom">
            <textaera placeholder="Votre message"></textaera>
            <button type="submit">Envoyer</button>
        </form>
    </section>
</body>
<footer>
    <p>Example footer | 2025</p>
</footer>
</html>
